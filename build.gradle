plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    implementation "curse.maven:tacz-1-21-1-1353462:9027337"
    implementation "curse.maven:neurolib-1484243:8060559"
}

processResources {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
                      mod_license: mod_license, mod_authors: mod_authors,
                      mod_description: mod_description, loader_version_range: loader_version_range,
                      minecraft_version_range: minecraft_version_range, neo_version: neo_version]
    inputs.properties properties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) { expand properties }
    exclude '.cache/**'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
apply from: 'gradle/publishing-local.gradle'
